name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  sync-and-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # galaga.html is a hand-synced standalone copy of index.html. Nothing in
      # the repo enforced that, so the two drifted historically.
      - name: galaga.html matches index.html
        run: |
          if ! cmp -s index.html galaga.html; then
            echo "::error::galaga.html has drifted from index.html — run: cp index.html galaga.html"
            exit 1
          fi
          echo "index.html and galaga.html are identical"

      - name: Inline script parses
        run: |
          node -e '
            const fs = require("fs");
            const html = fs.readFileSync("index.html", "utf8");
            const m = html.match(/<script>([\s\S]*)<\/script>/);
            if (!m) { console.error("no inline <script> found in index.html"); process.exit(1); }
            fs.writeFileSync("/tmp/game.js", m[1]);
          '
          node --check /tmp/game.js
          echo "inline script parses"
